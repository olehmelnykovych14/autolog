name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  bot:
    name: Telegram bot — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot-server/package-lock.json
      - run: npm ci
      - run: npm test
